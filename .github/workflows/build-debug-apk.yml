name: Build LastWave Debug APK

# `build.yml` builds `assembleRelease`, which needs SIGNING_KEY /
# RELEASE_STORE_PASSWORD as repo secrets: app/build.gradle.kts refuses to sign a
# release variant with the runner's debug key (that APK would install once, then
# break every update with INSTALL_FAILED_UPDATE_INCOMPATIBLE). This checkout has
# no such secrets, so this job builds the debug variant instead - signed with the
# developer machine's debug key from DEBUG_KEYSTORE_BASE64 and, with the
# applicationId override, installable next to a release app already on the phone.
#
# The job signs with the same debug keystore as the developer machine, taken
# base64-encoded from the DEBUG_KEYSTORE_BASE64 repository secret. Signed with
# another key the APK installs only after an uninstall, and the uninstall wipes
# the app data (INSTALL_FAILED_UPDATE_INCOMPATIBLE, which OEM installers word as
# "package conflicts with an existing package on the device"). AGP 9 signs the
# debug variant with a keystore of its own, so the staging step re-signs the APK
# with this key and fails when the signer does not match it.
#
# Manual on purpose: it must not race the release job on every push.
on:
  workflow_dispatch:
    inputs:
      application_id:
        description: 'applicationId of the debug build (defaults to the side-by-side id)'
        required: false
        default: 'com.lastwave.app.debug'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # The key must be the one the phone already trusts, so it comes from the
      # repository secret rather than from a per-runner cache or a generated
      # key. base64 -d ignores the CRLF of a Windows-made base64 string once the
      # whitespace is stripped; the keytool check fails the job early on a wrong
      # upload instead of on the phone at install time.
      - name: Write the debug signing key from the repository secret
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is empty: add the base64 of %USERPROFILE%\.android\debug.keystore as a repository secret"
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey > /dev/null

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          # Quoted as one bash argument: an unquoted -PapplicationId=a.b.c lets
          # the tail after the first dot be parsed as a Gradle task name.
          APP_ID: ${{ inputs.application_id || 'com.lastwave.app.debug' }}
        run: ./gradlew :app:assembleDebug "-PapplicationId=$APP_ID" --stacktrace

      - name: Stage Final APK
        id: prep_apk
        run: |
          mkdir -p final_apk
          VERSION=$(grep -m1 -oE 'versionName = "[^"]+"' app/build.gradle.kts | sed -E 's/.*"(.*)"/\1/')
          [ -n "$VERSION" ] || VERSION="5.0.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          APK="final_apk/LastWave-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          # An unsigned or mis-signed APK is what the installer reports as a
          # package conflict, so prove the signature and publish the signer
          # digest: it must match the key of the copy already on the phone.
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(find "$SDKROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          if [ -x "$BUILD_TOOLS/apksigner" ]; then
            # AGP 9 signs the debug variant with a keystore of its own: a run
            # printed a "keystore sha256" different from the APK signer digest, a
            # fresh key per run, i.e. the bug this job exists to fix. Re-sign with
            # the key from the secret; zipalign already ran in AGP and apksigner
            # keeps it.
            "$BUILD_TOOLS/apksigner" sign \
              --ks ~/.android/debug.keystore --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --out "$APK.resigned" "$APK"
            mv "$APK.resigned" "$APK"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > final_apk/SIGNER.txt
          else
            echo "apksigner not found under $SDKROOT, APK signature not verified" > final_apk/SIGNER.txt
            echo "::warning::apksigner not found under $SDKROOT, APK signature not verified"
          fi
          # The same question from the other side: the digest of the key from the
          # secret. keytool prints A-F and colons, apksigner lower case without,
          # so normalise both and fail the job when they differ: an APK signed by
          # another key is one the phone refuses to update over the installed app.
          KS_SHA256=$(keytool -list -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey 2>/dev/null \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-Z' 'a-z')
          APK_SHA256=$(sed -n 's/.*certificate SHA-256 digest: *//p' final_apk/SIGNER.txt | head -n1)
          echo "keystore sha256=$KS_SHA256" >> final_apk/SIGNER.txt
          cat final_apk/SIGNER.txt
          if [ -n "$APK_SHA256" ] && [ "$APK_SHA256" != "$KS_SHA256" ]; then
            echo "::error::APK signer $APK_SHA256 does not match the debug keystore $KS_SHA256"
            exit 1
          fi
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -lh final_apk/

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LastWave-v${{ steps.prep_apk.outputs.version }}-debug-APK
          path: final_apk/*
          if-no-files-found: error

      # Robolectric fetches its android-all-instrumented jar from Maven on the
      # first test run; a failed download fails the class (classMethod FAILED)
      # and turns the job red without a code problem.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      # Last, so a red test never costs the artifact this workflow exists for.
      - name: Car library unit tests
        run: >
          ./gradlew :app:testDebugUnitTest
          --tests 'com.lastwave.app.data.playlist.CarMediaFavoritesTest'
          --tests 'com.lastwave.app.playback.AndroidAutoMediaLibrarySearchTest'
          --tests 'com.lastwave.app.data.music.ChartCardsParserTest'
          --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Car-library-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
