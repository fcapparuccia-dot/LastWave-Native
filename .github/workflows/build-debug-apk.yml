name: Build LastWave Debug APK

# `build.yml` builds `assembleRelease`, which needs SIGNING_KEY /
# RELEASE_STORE_PASSWORD as repo secrets: app/build.gradle.kts refuses to sign a
# release variant with the runner's debug key (that APK would install once, then
# break every update with INSTALL_FAILED_UPDATE_INCOMPATIBLE). This checkout has
# no such secrets, so this job builds the debug variant instead - signed with the
# runner's debug key and, with the applicationId override, installable next to a
# release app already on the phone.
#
# The debug keystore below is cached, so every run of this job signs with the
# same key. A fresh key per run would make each new APK uninstallable over the
# previous run's install (INSTALL_FAILED_UPDATE_INCOMPATIBLE, which OEM
# installers word as "package conflicts with an existing package on the
# device"). It is still not the local %USERPROFILE%\.android\debug.keystore, so
# the first CI APK needs one `adb uninstall com.lastwave.app.debug`. AGP 9 signs
# the debug variant with a keystore of its own, so the staging step re-signs the
# APK with this cached key.
#
# Manual on purpose: it must not race the release job on every push.
on:
  workflow_dispatch:
    inputs:
      application_id:
        description: 'applicationId of the debug build (defaults to the side-by-side id)'
        required: false
        default: 'com.lastwave.app.debug'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # AGP generates ~/.android/debug.keystore on the runner when it is missing,
      # so without this cache every run signs with a different key and the APK
      # cannot update the previous run's install.
      - name: Restore the debug signing key
        id: debug_keystore
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/debug.keystore
          key: lastwave-ci-debug-keystore-v1

      # actions/cache only saves a path that still exists at the end of the job,
      # and the first run of this job ended with "Path Validation Error: Path(s)
      # ... do(es) not exist, hence no cache is being saved" - so the miss would
      # never turn into a hit. Create the file here, with the alias and passwords
      # AGP itself uses, so a restored key and a generated key are interchangeable.
      - name: Create the debug signing key on a cache miss
        if: steps.debug_keystore.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -noprompt \
            -keystore ~/.android/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          # Quoted as one bash argument: an unquoted -PapplicationId=a.b.c lets
          # the tail after the first dot be parsed as a Gradle task name.
          APP_ID: ${{ inputs.application_id || 'com.lastwave.app.debug' }}
        run: ./gradlew :app:assembleDebug "-PapplicationId=$APP_ID" --stacktrace

      - name: Stage Final APK
        id: prep_apk
        run: |
          mkdir -p final_apk
          VERSION=$(grep -m1 -oE 'versionName = "[^"]+"' app/build.gradle.kts | sed -E 's/.*"(.*)"/\1/')
          [ -n "$VERSION" ] || VERSION="5.0.0"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          APK="final_apk/LastWave-v${VERSION}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          # An unsigned or mis-signed APK is what the installer reports as a
          # package conflict, so prove the signature and publish the signer
          # digest: it must match the key of the copy already on the phone.
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS=$(find "$SDKROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          if [ -x "$BUILD_TOOLS/apksigner" ]; then
            # AGP 9 signs the debug variant with a keystore of its own, not the
            # cached one: the run that added the digest line below printed a
            # "keystore sha256" different from the APK signer digest, a fresh key
            # per run, i.e. the bug this job exists to fix. Re-sign with the key
            # the job keeps; zipalign already ran in AGP and apksigner keeps it.
            "$BUILD_TOOLS/apksigner" sign \
              --ks ~/.android/debug.keystore --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --out "$APK.resigned" "$APK"
            mv "$APK.resigned" "$APK"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > final_apk/SIGNER.txt
          else
            echo "apksigner not found under $SDKROOT, APK signature not verified" > final_apk/SIGNER.txt
            echo "::warning::apksigner not found under $SDKROOT, APK signature not verified"
          fi
          # The same question from the other side: the digest of the key this job
          # keeps. It has to equal the APK signer digest above, otherwise the APK
          # is signed by a key that never reaches the cache and the next run's
          # APK cannot update it. keytool prints A-F and colons, apksigner lower
          # case without, so normalise to compare by eye.
          echo "keystore sha256=$(keytool -list -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey 2>/dev/null \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-Z' 'a-z')" >> final_apk/SIGNER.txt
          cat final_apk/SIGNER.txt
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -lh final_apk/

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LastWave-v${{ steps.prep_apk.outputs.version }}-debug-APK
          path: final_apk/*
          if-no-files-found: error

      # Last, so a red test never costs the artifact this workflow exists for.
      - name: Car library unit tests
        run: >
          ./gradlew :app:testDebugUnitTest
          --tests 'com.lastwave.app.data.playlist.CarMediaFavoritesTest'
          --tests 'com.lastwave.app.playback.AndroidAutoMediaLibrarySearchTest'
          --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Car-library-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
